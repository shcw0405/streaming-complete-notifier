<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>回响</title><link rel="stylesheet" href="relay-ui.css"><script src="popup.js" defer></script></head>
<body class="popup">
<header><img src="icon48.png" width="36" height="36" alt=""><strong>回响 <small>Relay</small></strong><button id="openOptions" class="link">管理 ↗</button></header>
<div class="platforms"><label>ChatGPT<input id="chatgptEnabled" type="checkbox"></label><label>Gemini<input id="geminiEnabled" type="checkbox"></label><label>Grok<input id="grokEnabled" type="checkbox"></label><label>AI Studio<input id="aistudioEnabled" type="checkbox"></label></div>
<label class="row">桌面通知<input id="notificationEnabled" type="checkbox"></label><label class="row">提示音<input id="soundEnabled" type="checkbox"></label><div class="row"><label for="volumeSlider">音量</label><output id="volumeValue">100%</output></div>
<input id="volumeSlider" type="range" min="0" max="1.5" step="0.01" aria-label="提示音音量"><button id="testButton" class="primary wide">试听提示音</button>
</body></html>
