<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回响 · 插件管理</title><link rel="stylesheet" href="relay-ui.css"><script src="options.js" defer></script></head>
<body><main class="management"><header><img src="icon128.png" width="56" height="56" alt="回响图标"><div><h1>回响 · 插件管理</h1><small>网页提醒与本地工具，一个入口</small></div></header>
<section><h2>本机回响</h2><p id="connection-state" role="status">正在自动检测…</p><p id="connection-address" hidden></p><p class="muted">连接后可在回响工作台统一管理 Claude Code、Codex、OpenCode 和网页提醒。不连接也能独立使用网页提醒。</p><div class="actions"><button id="detect">重新检测</button><button id="connect" class="primary" hidden>连接此应用</button><button id="open-manager" class="primary" hidden>打开统一工作台 ↗</button><button id="disconnect" hidden>断开连接</button></div></section>
<section><h2>提醒设置</h2><div class="platforms"><label>ChatGPT<input data-setting="chatgptEnabled" type="checkbox"></label><label>Gemini<input data-setting="geminiEnabled" type="checkbox"></label><label>Grok<input data-setting="grokEnabled" type="checkbox"></label><label>AI Studio<input data-setting="aistudioEnabled" type="checkbox"></label></div>
<label class="row">桌面通知<input data-setting="notificationEnabled" type="checkbox"></label><label class="row">提示音<input data-setting="soundEnabled" type="checkbox"></label><label class="row">音量<output id="volume">100%</output></label><input data-setting="soundVolume" type="range" min="0" max="1.5" step="0.01" aria-label="音量"><label class="row">ChatGPT 思考结束时提醒<input data-setting="chatgptReasoningEndEnabled" type="checkbox"></label><label class="row">保持后台 AI 页面活跃<input data-setting="tabKeepAliveEnabled" type="checkbox"></label><p>后台保活修改后需刷新已打开的 AI 页面。</p></section>
<section><h2>诊断</h2><label class="row">ChatGPT 诊断模式<input data-setting="chatgptDiagnosticModeEnabled" type="checkbox"></label><div class="actions"><button id="copy-logs">复制诊断日志</button><button id="clear-logs">清空诊断日志</button></div></section><p id="status" role="status">开关修改后自动保存。</p></main></body></html>
